[project]
name = "svm-kernel-lab-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.2",
  "numpy>=2.0",
  "scikit-learn>=1.6",
  "uvicorn>=0.38.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "svm_engine"]
